<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        .container {
            width: 800px;
            /* height: 500px; */
            background-color: lightpink;
            /* overflow: hidden;   영역을 벗어난 대상을 숨김 처리 */
        }

        .header { display: flex; }

        .header-left {
            width: 50%;
            height: 100px;
            background-color: yellow;
        }

        .header-right {
            width: 50%;
            height: 100px;
            background-color: gray;
        }

        .nav {
            width: 100%;
            height: 100px;
            background-color: purple;
        }

        .main-left {
            width: 40%;
            height: 200px;
            background-color: lightblue;
        }

        .main-right {
            width: 60%;
            height: 200px;
            background-color: yellow;
        }

        .main {display: flex;}

        .main-right-1 {
            background-color: yellow;
            height: 100px;
        }
        
        .main-right-2 {
            background-color: lightpink;
            height: 100px;
        }

        .footer-1 {
            width: 25%;
            height: 100px;
            background-color: yellow;
        }

        .footer-2 {
            width: 25%;
            height: 100px;
            background-color: orange;
        }

        .footer-3 {
            width: 25%;
            height: 100px;
            background-color: yellow;
        }

        .footer-4 {
            width: 25%;
            height: 100px;
            background-color: lightgreen;
        }

        .footer { display: flex; }
    </style>
<body>
    
    <div class="container">
        
        <div class="header">
            <div class="header-left"></div>
            <div class="header-right"></div>
        </div>


        <div class="nav"></div>

        <div class="main">
            <div class="main-left"></div>
            <div class="main-right">
                <div class="main-right-1"></div>
                <div class="main-right-2"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-1"></div>
            <div class="footer-2"></div>
            <div class="footer-3"></div>
            <div class="footer-4"></div>
        </div>



    </div>


</body>
</html>
