<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        <style>
        
        *   {
            margin:0;
            padding:0;
            box-sizing: border-box;
            }

        .container {
            margin: 0 auto;
            width: 500px;
            top: 50px;
            position:relative;
            text-align:center;

        }

        .red-box {
            background-color: red;
            width: 250px;
            height: 100px;
            position:relative;
        }

        .green-box {
            background-color: green;
            width: 250px;
            height: 100px;
            position:absolute;
            left: 250px;
            top: 0px;
        }

        .blue-box {
            background-color: blue;
            width: 500px;
            height: 200px;
            position:relative;
        }
        </style>
        
</head>
<body>
    
    <div class="container">
        <div class="red-box"></div>
        <div class="green-box"></div>
        <div>글자가운데정렬</div>
        <div class="blue-box"></div>
    </div>

</body>
</html>
