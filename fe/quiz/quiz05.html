<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- css 작성 영역 -->
    <style>
        /* Alt+Shift+F 정렬 */
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <form action="https://www.naver.com">

        <h1>나의 점심 취향 설문조사</h1>
        이름 :<input type="text">

        <br><br>

        <fieldset>
            <legend>학년 선택</legend>
            <table>
                <tr>
                    <th>번호</th>
                    <th>학년</th>
                    <th>선택</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td><lable for="gr1">1학년</lable></td>
                    <td><input type="radio" name="grade" id="gr1"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td><lable for="gr2">2학년</lable></td>
                    <td><input type="radio" name="grade" id="gr2"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td><lable for="gr3">3학년</lable></td>
                    <td><input type="radio" name="grade" id="gr3"></td>
                </tr>
                <tr>
                    <td>4</td>
                    <td><lable for="gr4">4학년</lable></td>
                    <td><input type="radio" name="grade" id="gr4"></td>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>좋아하는 음식(복수 선택 가능)</legend>
            <label><input type="checkbox" name="food"> 한식</label><br>
            <label><input type="checkbox" name="food"> 중식</label><br>
            <label><input type="checkbox" name="food"> 일식</label><br>
            <label><input type="checkbox" name="food"> 양식</label><br>
            <label><input type="checkbox" name="food"> 분식</label>
        </fieldset>

        <br>

        <input type="submit" value="제출하기">
    </form>

</body>

</html>
