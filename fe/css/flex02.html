<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .blue {
            background-color: blue;
            width: 200px;
            height: 200px;
            }

        .red {
            background-color: red;
            width: 200px;
            height: 200px;
        
            display: flex;
            flex-direction: column;
        }

        .green {
            background-color: green;
            width: 200px;
            height: 100px;
        }

                .orange {
            background-color: orange;
            width: 200px;
            height: 100px;
        
            display: flex;
        }

        .box {
            display: flex;
        }

        .purple {
            background-color: purple;
            width: 100px;
            height: 100px;
        }

        .pink {
            background-color: pink;
            width: 100px;
            height: 100px;
        }

        .left {
            background-color: red;
            width: 100px;
            height: 50px;
        }

        .right {
            background-color: blue;
            width: 100px;
            height: 50px;
        }

        .nav {
            display: flex;  
            justify-content: space-between
        }
    </style>
</head>
<body>
    
    <div class="box">
        <div class="blue"></div>
        <div class="red">
            <div class="green"></div>
            <div class="orange">
                <div class="purple"></div>
                <div class="pink"></div>
            </div>
        </div>
    </div>

    <!-- nav navigator header top -->
    <div class="nav">
        <div class="left"></div>
        <div class="right"></div>
    </div>


</body>
</html>
