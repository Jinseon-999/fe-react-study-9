<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* 기본 베이스 설정 */
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        .box {
            border: 2px solid blue;
            padding: 15px;
            margin: 30px;
        }

        .box2 {
            /* margin은 인접한 요소중 가장 큰 margin을 사용 */
            margin: 50px;
            margin-top: 100px;
            padding-left: 30px;

            /* border:3px dashed red; */

            border-width: 2px;
            border-style: dashed;
            border-color: red;

            /* 컨텐츠 내용크기 */
            width: 200px;
            height: 150px;   
            
            /* box-sizing: border-box; border와 padding을 포함한 크기 */
            /* box-sizing: content-box; 컨텐츠 내용크기만 적용 */

        }


    </style>



</head>
<body>
    
    <div class="box">
        box1
    </div>

    <div class="box2">
        box2
    </div>

    <p>다른 요소 p태그</p>

</body>
</html>
